<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at top, #1a1e29, #0a0c10);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      padding: 12px;
    }

    /* Верхняя панель со счетом */
    .scoreboard {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 380px;
      justify-content: space-between;
    }

    .score-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 14px;
      text-align: center;
      flex: 1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .score-card .title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #7b88a8;
      text-transform: uppercase;
    }

    .score-card .value {
      font-size: 24px;
      font-weight: 800;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .score-card.best .value {
      color: #ffaa00;
      text-shadow: 0 0 10px rgba(255, 170, 0, 0.4);
    }

    /* Игровое поле */
    .canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background: #0d1117;
      border: 2px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
      display: block;
    }

    /* Кнопки управления (D-Pad) */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      grid-template-rows: repeat(3, 68px);
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e6edf3;
      border-radius: 18px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      transition: all 0.1s ease;
      outline: none;
    }

    .btn:active {
      background: #00f0ff;
      color: #0d1117;
      transform: scale(0.92);
      box-shadow: 0 0 15px #00f0ff;
    }

    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <div class="scoreboard">
    <div class="score-card">
      <div class="title">Счёт</div>
      <div class="value" id="currentScore">0</div>
    </div>
    <div class="score-card best">
      <div class="title">Рекорд</div>
      <div class="value" id="highScore">0</div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="340" height="340"></canvas>
  </div>

  <div class="controls">
    <button class="btn" id="btn-up">▲</button>
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-right">▶</button>
    <button class="btn" id="btn-down">▼</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');

    // Настройки поля
    const gridSize = 17; // 20 клеток по 17px = 340px
    const tileCount = canvas.width / gridSize;
    const TOTAL_FOOD = 3; // Количество яблок одновременно на поле

    let snake = [];
    let foods = [];
    let dx = gridSize;
    let dy = 0;
    let nextDx = gridSize;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    let gameInterval = null;

    highScoreEl.textContent = highScore;

    function resetGame() {
      score = 0;
      currentScoreEl.textContent = score;
      dx = gridSize;
      dy = 0;
      nextDx = gridSize;
      nextDy = 0;

      // Начальная змейка
      snake = [
        { x: gridSize * 5, y: gridSize * 10 },
        { x: gridSize * 4, y: gridSize * 10 },
        { x: gridSize * 3, y: gridSize * 10 }
      ];

      // Спавним все яблоки
      foods = [];
      for (let i = 0; i < TOTAL_FOOD; i++) {
        spawnSingleFood();
      }
    }

    function spawnSingleFood() {
      let position;
      let collision;
      do {
        collision = false;
        position = {
          x: Math.floor(Math.random() * tileCount) * gridSize,
          y: Math.floor(Math.random() * tileCount) * gridSize
        };
        // Проверяем, чтобы не упало на змейку
        for (let seg of snake) {
          if (seg.x === position.x && seg.y === position.y) {
            collision = true;
            break;
          }
        }
        // И на другое уже лежащее яблоко
        for (let f of foods) {
          if (f.x === position.x && f.y === position.y) {
            collision = true;
            break;
          }
        }
      } while (collision);

      foods.push(position);
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Столкновение со стенами -> Рестарт
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return resetGame();
      }

      // Столкновение с собственным хвостом
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          return resetGame();
        }
      }

      snake.unshift(head);

      // Проверка съедания любого из яблок
      let ateFoodIndex = -1;
      for (let i = 0; i < foods.length; i++) {
        if (head.x === foods[i].x && head.y === foods[i].y) {
          ateFoodIndex = i;
          break;
        }
      }

      if (ateFoodIndex !== -1) {
        score += 10;
        currentScoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        // Удаляем съеденное и спавним новое
        foods.splice(ateFoodIndex, 1);
        spawnSingleFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Очистка поля с мягким шлейфом
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Рисуем легкую сетку
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Рисуем яблоки (неоновые ягоды с сиянием)
      foods.forEach((food) => {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff3366';
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        const r = gridSize / 2.3;
        ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, r, 0, Math.PI * 2);
        ctx.fill();

        // Блик на яблоке
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(food.x + gridSize / 2 - 2, food.y + gridSize / 2 - 2, r / 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Рисуем змейку
      snake.forEach((seg, index) => {
        ctx.save();
        const isHead = index === 0;

        if (isHead) {
          ctx.fillStyle = '#00f0ff';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#00f0ff';
        } else {
          // Градиентное угасание цвета к хвосту
          const alpha = 1 - (index / (snake.length + 5));
          ctx.fillStyle = `rgba(0, 180, 216, ${Math.max(alpha, 0.3)})`;
        }

        // Закругленные сегменты
        const pad = 1.5;
        const radius = 5;
        ctx.beginPath();
        ctx.roundRect(seg.x + pad, seg.y + pad, gridSize - pad * 2, gridSize - pad * 2, radius);
        ctx.fill();

        // Рисуем глазки на голове в направлении движения
        if (isHead) {
          ctx.fillStyle = '#0d1117';
          const cx = seg.x + gridSize / 2;
          const cy = seg.y + gridSize / 2;
          let eyeX1 = cx, eyeY1 = cy, eyeX2 = cx, eyeY2 = cy;

          if (dx > 0) { // вправо
            eyeX1 = eyeX2 = cx + 3;
            eyeY1 = cy - 4; eyeY2 = cy + 4;
          } else if (dx < 0) { // влево
            eyeX1 = eyeX2 = cx - 3;
            eyeY1 = cy - 4; eyeY2 = cy + 4;
          } else if (dy > 0) { // вниз
            eyeY1 = eyeY2 = cy + 3;
            eyeX1 = cx - 4; eyeX2 = cx + 4;
          } else if (dy < 0) { // вверх
            eyeY1 = eyeY2 = cy - 3;
            eyeX1 = cx - 4; eyeX2 = cx + 4;
          }

          ctx.beginPath();
          ctx.arc(eyeX1, eyeY1, 1.8, 0, Math.PI * 2);
          ctx.arc(eyeX2, eyeY2, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      });
    }

    function gameLoop() {
      update();
      draw();
    }

    // Управление кнопками
    function moveUp() {
      if (dy === 0) { nextDx = 0; nextDy = -gridSize; }
    }
    function moveDown() {
      if (dy === 0) { nextDx = 0; nextDy = gridSize; }
    }
    function moveLeft() {
      if (dx === 0) { nextDx = -gridSize; nextDy = 0; }
    }
    function moveRight() {
      if (dx === 0) { nextDx = gridSize; nextDy = 0; }
    }

    // Вешаем слушатели на экранные кнопки
    document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); moveUp(); });
    document.getElementById('btn-up').addEventListener('click', moveUp);

    document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); moveDown(); });
    document.getElementById('btn-down').addEventListener('click', moveDown);

    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
    document.getElementById('btn-left').addEventListener('click', moveLeft);

    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
    document.getElementById('btn-right').addEventListener('click', moveRight);

    // Поддержка клавиш клавиатуры (если тестировать с ПК или Bluetooth-клавиатуры)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') moveUp();
      if (e.key === 'ArrowDown') moveDown();
      if (e.key === 'ArrowLeft') moveLeft();
      if (e.key === 'ArrowRight') moveRight();
    });

    // Старт игры со скоростью обновления 110 мс (~9 кадров логики/сек)
    resetGame();
    gameInterval = setInterval(gameLoop, 400);
  </script>
</body>
</html>
