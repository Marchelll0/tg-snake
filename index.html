<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cyber Shooter</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #060913;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 8px 12px;
    }

    .top-bar {
      display: flex;
      width: 100%;
      max-width: 400px;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      margin-bottom: 8px;
    }

    .lives {
      color: #ff3366;
      font-size: 18px;
      letter-spacing: 3px;
    }

    .powerups {
      display: flex;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
    }

    .badge {
      padding: 3px 6px;
      border-radius: 6px;
      display: none;
    }

    .badge-shield {
      background: rgba(0, 240, 255, 0.2);
      border: 1px solid #00f0ff;
      color: #00f0ff;
    }

    .badge-double {
      background: rgba(189, 0, 255, 0.2);
      border: 1px solid #bd00ff;
      color: #bd00ff;
    }

    .score-box {
      text-align: right;
    }

    .score-title {
      font-size: 9px;
      color: #7b88a8;
      text-transform: uppercase;
    }

    .score-val {
      font-size: 18px;
      font-weight: 800;
      color: #00f0ff;
    }

    canvas {
      background: #0b0f19;
      border: 2px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="lives" id="livesEl">♥♥♥</div>
    <div class="powerups">
      <div class="badge badge-shield" id="shieldBadge">ЩИТ</div>
      <div class="badge badge-double" id="doubleBadge">2X</div>
    </div>
    <div class="score-box">
      <div class="score-title">Очки</div>
      <div class="score-val" id="scoreEl">0</div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');
    const shieldBadge = document.getElementById('shieldBadge');
    const doubleBadge = document.getElementById('doubleBadge');

    // Автоматическая подгонка размера под экран смартфона
    function resizeCanvas() {
      const topBarHeight = document.querySelector('.top-bar').offsetHeight;
      canvas.width = Math.min(window.innerWidth - 24, 380);
      canvas.height = window.innerHeight - topBarHeight - 32;
    }
    resizeCanvas();

    let score = 0;
    let lives = 3;
    let gameOver = false;

    const player = {
      x: canvas.width / 2 - 18,
      y: canvas.height - 55,
      w: 36,
      h: 28,
      hasShield: false,
      doubleUntil: 0
    };

    let bullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let stars = [];
    let lastFire = 0;

    // Звезды на фоне
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.6 + 0.5,
        speed: Math.random() * 1.5 + 0.5
      });
    }

    // Управление пальцем: корабль точно повторяет движение пальца
    function handleTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const touchX = clientX - rect.left;
      player.x = Math.max(0, Math.min(canvas.width - player.w, touchX - player.w / 2));
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
    canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleTouch(e); });

    function spawnEnemy() {
      if (gameOver) return;
      enemies.push({
        x: Math.random() * (canvas.width - 28),
        y: -30,
        w: 26,
        h: 22,
        speed: Math.random() * 1.5 + 1.8
      });
    }
    setInterval(spawnEnemy, 900);

    function createExplosion(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1,
          color
        });
      }
    }

    function trySpawnPowerup(x, y) {
      if (Math.random() < 0.35) {
        powerups.push({
          x, y,
          speed: 1.8,
          type: Math.random() < 0.5 ? 'shield' : 'double'
        });
      }
    }

    function autoFire() {
      const now = Date.now();
      if (now - lastFire > 180) { // Интервал автострельбы
        const isDouble = now < player.doubleUntil;
        if (isDouble) {
          bullets.push({ x: player.x + 3, y: player.y, w: 4, h: 10, speed: 9, color: '#bd00ff' });
          bullets.push({ x: player.x + player.w - 7, y: player.y, w: 4, h: 10, speed: 9, color: '#bd00ff' });
        } else {
          bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, speed: 8.5, color: '#00f0ff' });
        }
        lastFire = now;
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      player.x = canvas.width / 2 - 18;
      player.hasShield = false;
      player.doubleUntil = 0;
      bullets = [];
      enemies = [];
      powerups = [];
      particles = [];
      scoreEl.textContent = '0';
      livesEl.textContent = '♥♥♥';
    }

    function update() {
      if (gameOver) return;

      const now = Date.now();
      shieldBadge.style.display = player.hasShield ? 'block' : 'none';
      doubleBadge.style.display = now < player.doubleUntil ? 'block' : 'none';

      autoFire();

      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      });

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      // Бонусы
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.speed;
        if (p.x > player.x - 12 && p.x < player.x + player.w + 12 &&
            p.y > player.y - 12 && p.y < player.y + player.h + 12) {
          if (p.type === 'shield') player.hasShield = true;
          if (p.type === 'double') player.doubleUntil = now + 10000;
          haptic('success');
          createExplosion(p.x, p.y, p.type === 'shield' ? '#00f0ff' : '#bd00ff');
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > canvas.height + 20) powerups.splice(i, 1);
      }

      // Враги
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            createExplosion(e.x + e.w / 2, e.y + e.h / 2, '#ffaa00');
            haptic('light');
            trySpawnPowerup(e.x + e.w / 2, e.y + e.h / 2);
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 20;
            scoreEl.textContent = score;
            break;
          }
        }

        if (e && player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
          enemies.splice(i, 1);
          if (player.hasShield) {
            player.hasShield = false;
            createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#00f0ff');
            haptic('medium');
          } else {
            createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ff3366');
            haptic('error');
            lives--;
            livesEl.textContent = '♥'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              gameOver = true;
              setTimeout(() => { alert('Игра окончена! Счет: ' + score); resetGame(); }, 80);
            }
          }
          continue;
        }

        if (e && e.y > canvas.height + 20) enemies.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#080c16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Капсулы
      powerups.forEach(p => {
        const col = p.type === 'shield' ? '#00f0ff' : '#bd00ff';
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = col;
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'shield' ? 'S' : '2X', p.x, p.y);
      });

      // Корабль
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x + player.w / 2, player.y + player.h - 6);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      if (player.hasShield) {
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Пули
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Враги
      ctx.fillStyle = '#ff3366';
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.moveTo(e.x + e.w / 2, e.y + e.h);
        ctx.lineTo(e.x + e.w, e.y);
        ctx.lineTo(e.x, e.y);
        ctx.closePath();
        ctx.fill();
      });

      // Взрывы
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2.5, 2.5);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
