<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }
    #score-bar {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    canvas {
      background-color: var(--tg-theme-secondary-bg-color, #2b2b2b);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .hint {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="score-bar">Счёт: <span id="score">0</span></div>
  <canvas id="gameCanvas"></canvas>
  <div class="hint">Управляйте свайпами по экрану</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    const size = Math.min(window.innerWidth - 32, window.innerHeight - 150);
    const gridSize = 20;
    canvas.width = Math.floor(size / gridSize) * gridSize;
    canvas.height = canvas.width;
    const tileCount = canvas.width / gridSize;

    let score = 0;
    let snake = [{ x: 10, y: 10 }];
    let velocity = { x: 0, y: 0 };
    let food = { x: 5, y: 5 };
    let gameInterval = null;

    function resetGame() {
      score = 0;
      scoreEl.innerText = score;
      snake = [{ x: 10, y: 10 }];
      velocity = { x: 0, y: 0 };
      spawnFood();
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      for (let part of snake) {
        if (part.x === food.x && part.y === food.y) spawnFood();
      }
    }

    function update() {
      if (velocity.x === 0 && velocity.y === 0) return;

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        alert("Игра окончена! Счёт: " + score);
        resetGame();
        return;
      }

      for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
          alert("Игра окончена! Счёт: " + score);
          resetGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.innerText = score;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff4757";
      ctx.beginPath();
      const r = gridSize / 2;
      ctx.arc(food.x * gridSize + r, food.y * gridSize + r, r - 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#10ac84" : "#2ed573";
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    function gameLoop() {
      update();
      draw();
    }

    resetGame();
    gameInterval = setInterval(gameLoop, 120);

    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30 && velocity.x !== -1) velocity = { x: 1, y: 0 };
        else if (diffX < -30 && velocity.x !== 1) velocity = { x: -1, y: 0 };
      } else {
        if (diffY > 30 && velocity.y !== -1) velocity = { x: 0, y: 1 };
        else if (diffY < -30 && velocity.y !== 1) velocity = { x: 0, y: -1 };
      }
    }, { passive: false });
  </script>
</body>
</html>
